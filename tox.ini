[tox]
requires =
    tox>=4.2
envlist =
    ruff
    dj52_cms50
    dj52_cms51
    dj60_cms50
    dj60_cms51
    dj61_cms51
    finder
skip_missing_interpreters=True

[testenv]
deps =
    -r tests/requirements/{envname}.txt
commands =
    coverage erase
    coverage run -m pytest
    coverage report -m

[testenv:ruff]
deps = ruff
commands = ruff check djangocms_picture
skip_install = true

[testenv:finder]
deps =
    -r tests/requirements/dj61_cms51_finder.txt
setenv =
    DJANGO_SETTINGS_MODULE = tests.settings_finder
