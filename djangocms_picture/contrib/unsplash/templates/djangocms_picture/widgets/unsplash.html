{% load i18n %}
<div
  class="djangocms-picture-unsplash"
  data-unsplash-picker
  data-picker-url="{{ widget.picker_url }}"
  data-application-name="{{ widget.application_name }}"
>
  {% include "django/forms/widgets/textarea.html" %}
  <div class="djangocms-picture-unsplash-preview" data-unsplash-current{% if not widget.preview_url %} hidden{% endif %}>
    <img src="{{ widget.preview_url }}" alt="" data-unsplash-preview>
    <span>
      <span data-unsplash-label>{{ widget.label }}</span>
      <small data-unsplash-attribution>
        {% translate "Photo by" %}
        <a href="{{ widget.photographer_url }}" target="_blank" rel="noopener noreferrer" data-unsplash-photographer>{{ widget.photographer_name }}</a>
        {% translate "on" %}
        <a href="{{ widget.photo_url }}" target="_blank" rel="noopener noreferrer" data-unsplash-provider>Unsplash</a>
      </small>
    </span>
  </div>
  <div class="djangocms-picture-unsplash-actions">
    <button type="button" class="button" data-unsplash-open>{% translate "Select Unsplash image" %}</button>
    <button type="button" data-unsplash-clear{% if not widget.preview_url %} hidden{% endif %}>{% translate "Clear" %}</button>
  </div>
</div>
