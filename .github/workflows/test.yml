name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        requirements-file: [
            dj52_cms50.txt,
            dj52_cms51.txt,
            dj60_cms50.txt,
            dj60_cms51.txt,
            dj61_cms51.txt,
        ]
        os: [
            ubuntu-latest,
        ]
        exclude:
          # Django 6.x requires Python 3.12 or newer
          - python-version: "3.10"
            requirements-file: dj60_cms50.txt
          - python-version: "3.11"
            requirements-file: dj60_cms50.txt
          - python-version: "3.10"
            requirements-file: dj60_cms51.txt
          - python-version: "3.11"
            requirements-file: dj60_cms51.txt
          - python-version: "3.10"
            requirements-file: dj61_cms51.txt
          - python-version: "3.11"
            requirements-file: dj61_cms51.txt

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '2'

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -r tests/requirements/${{ matrix.requirements-file }}
    - name: Run coverage
      run: |
        coverage run -m pytest
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v6

  finder:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -r tests/requirements/dj61_cms51_finder.txt
    - name: Run experimental finder tests
      env:
        DJANGO_SETTINGS_MODULE: tests.settings_finder
      run: pytest tests/test_finder_backend.py -q
